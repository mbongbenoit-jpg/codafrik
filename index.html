<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0D18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bencor Shop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<script src="firebase-config.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bencor Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0D0D18;--bg2:#141420;--bg3:#1E1E2E;
  --b:rgba(255,255,255,.06);--b2:rgba(255,255,255,.12);
  --t:#EEEEF8;--t2:#666688;
  --ac:#FF5A3C;--ac2:#D83A1C;
  --gr:#00C896;--gr2:rgba(0,200,150,.12);
  --am:#FFB547;--am2:rgba(255,181,71,.12);
  --re:#FF5C7A;--re2:rgba(255,92,122,.12);
  --r:14px;--rs:9px;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.app{display:flex;flex-direction:column;min-height:100vh}
.top{background:var(--bg2);border-bottom:1px solid var(--b);padding:10px max(16px,calc((100vw - 760px)/2 + 14px));padding-top:max(10px,env(safe-area-inset-top));min-height:48px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.logo{font-size:15px;font-weight:800;background:linear-gradient(120deg,#FF5A3C,#FF8A70);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cbtn{background:var(--bg3);border:1px solid var(--b2);border-radius:8px;padding:0 10px;height:30px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;flex-shrink:0;line-height:1;font-size:12px;font-weight:600;color:#aaa;cursor:pointer;font-family:inherit}
#bell,#lo{margin-left:0!important}
.logo{white-space:nowrap}
.hlogo{height:30px;width:auto;display:block;flex-shrink:0}
@media (max-width:380px){.hlogo{height:25px}}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--gr);margin-left:auto;flex-shrink:0}
.sdot.e{background:var(--re)}.sdot.l{background:var(--am);animation:bl .8s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.rbar{background:var(--bg);border-bottom:1px solid var(--b);display:flex;padding:6px max(6px,calc((100vw - 760px)/2 + 6px));gap:5px}
.rb{flex:1;padding:8px 6px;border-radius:var(--rs);border:none;background:transparent;color:#555;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:.2s}
.rb.on{color:#fff}
.rb.ra.on{background:var(--ac2)}.rb.rc.on{background:#B45309}.rb.rl.on{background:#065F46}
.nav{background:var(--bg2);border-bottom:1px solid var(--b);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 max(0px,calc((100vw - 760px)/2))}
.nav::-webkit-scrollbar{display:none}
.nb{padding:11px 14px;border:none;background:transparent;color:#555;cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;transition:.15s}
.nb.on{color:var(--ac);border-bottom-color:var(--ac)}
.pill{background:var(--re);color:#fff;border-radius:20px;font-size:9px;padding:1px 5px;margin-left:2px;font-weight:700}
.ct{padding:14px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left));flex:1;max-width:760px;margin:0 auto;width:100%}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:14px;border-top:3px solid}
.kl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#555;margin-bottom:4px}
.kv{font-size:24px;font-weight:800;letter-spacing:-.5px}
.ks{font-size:11px;color:#555;margin-top:2px}
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ch{padding:12px 16px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;flex-wrap:wrap}
.cb{padding:16px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:500px}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#555;background:var(--bg3);border-bottom:1px solid var(--b)}
td{padding:9px 12px;border-bottom:1px solid var(--b);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.st{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.s0{background:rgba(59,130,246,.15);color:#7EB8FF}.s1{background:rgba(255,90,60,.15);color:#FFA08C}
.s2{background:var(--am2);color:#FFD080}.s3{background:var(--gr2);color:#60EEC0}
.s4{background:rgba(249,115,22,.15);color:#FFB07A}.s5{background:var(--am2);color:#FFD080}
.s6{background:rgba(0,200,150,.2);color:#00E8A8;font-weight:800}.s7{background:var(--re2);color:#FF8FAA}
.s8{background:rgba(100,100,130,.15);color:#888}.s9{background:rgba(255,50,50,.2);color:#FF3333;font-weight:800;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.btn{padding:8px 14px;border-radius:var(--rs);border:1px solid var(--b2);background:var(--bg3);cursor:pointer;font-size:12px;color:var(--t);font-family:inherit;font-weight:600;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:var(--ac2);border-color:var(--ac);color:#fff}
.bs{background:var(--gr2);border-color:rgba(0,200,150,.3);color:#60EEC0}
.bw{background:var(--am2);border-color:rgba(255,181,71,.3);color:#FFD080}
.bd{background:var(--re2);border-color:rgba(255,92,122,.3);color:#FF8FAA}
.bsm{padding:4px 9px;font-size:11px}
.bbl{width:100%;justify-content:center;padding:13px;border-radius:var(--r);font-size:13px;display:block;text-align:center}
.arow{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.arow>.btn{flex:1 1 120px;text-align:center}
.fr{margin-bottom:11px}
.fr label{font-size:10px;color:#555;display:block;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fr input,.fr select,.fr textarea{width:100%;padding:10px 12px;border-radius:var(--rs);border:1px solid var(--b2);background:var(--bg3);color:var(--t);font-family:inherit;font-size:13px;-webkit-appearance:none;outline:none;transition:.15s}
.fr input:focus,.fr select:focus,.fr textarea:focus{border-color:var(--ac)}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbar select,.fbar input{width:100%;min-width:0;padding:10px 12px;border-radius:var(--rs);border:1px solid var(--b2);background:var(--bg3);color:var(--t);font-family:inherit;font-size:13px;-webkit-appearance:none;appearance:none;outline:none;text-overflow:ellipsis}
.fbar select:focus,.fbar input:focus{border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--bg3);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:10px}
.ct2{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ci{font-size:10px;color:#555;font-weight:700;letter-spacing:.6px}
.ctel{font-size:16px;font-weight:800;color:var(--ac);text-decoration:none;display:block;margin:8px 0}
.cod{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rs);padding:14px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.codamt{font-size:30px;font-weight:900;color:var(--gr);letter-spacing:-1px}
.codlbl{font-size:10px;color:#555;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--b2);border-radius:20px 20px 0 0;padding:20px 18px max(38px,calc(env(safe-area-inset-bottom) + 20px));width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.mh{width:40px;height:4px;background:var(--b2);border-radius:2px;margin:0 auto 18px}
.modal h3{font-size:15px;font-weight:800;margin-bottom:5px}
.msub{font-size:12px;color:#555;margin-bottom:16px}
.mbtns{display:flex;gap:8px;margin-top:16px}
.mopts{display:grid;gap:6px;margin-bottom:10px}
.mopt{padding:10px 13px;border-radius:var(--rs);border:1px solid var(--b2);background:var(--bg3);cursor:pointer;font-size:12px;color:var(--t);text-align:left;width:100%;font-family:inherit;font-weight:500;transition:.15s}
.mopt.sel{border-color:var(--ac);background:rgba(255,90,60,.15);color:#FFA08C;font-weight:700}
.empty{text-align:center;padding:32px;color:#444;font-size:13px}
.loader{text-align:center;padding:40px;color:#444}
.spin{width:28px;height:28px;border:3px solid var(--b);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.hl{margin:4px 0 0}.hev{display:flex;gap:12px;padding-bottom:14px;position:relative}
.hev:not(:last-child):before{content:'';position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--b2)}
.hic{width:28px;height:28px;border-radius:50%;border:2px solid;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;z-index:1}
.stp{display:flex;gap:2px;margin:2px 0 10px}
.sti{flex:1;text-align:center;position:relative;color:#555;font-size:9px;font-weight:700;line-height:1.2}
.sti:not(:last-child):after{content:'';position:absolute;top:10px;left:calc(50% + 12px);right:calc(-50% + 12px);height:2px;background:var(--b2)}
.sti.ok:not(:last-child):after{background:var(--gr)}
.std{display:flex;width:20px;height:20px;border-radius:50%;margin:0 auto 3px;background:var(--bg3);border:2px solid var(--b2);align-items:center;justify-content:center;font-size:10px;font-weight:800;position:relative;z-index:1}
.sti.ok{color:var(--gr)}.sti.ok .std{background:var(--gr);border-color:var(--gr);color:#04140F}
.sti.on{color:var(--t)}.sti.on .std{background:var(--ac);border-color:var(--ac);color:#fff}
.sti.rp{color:#FF6B6B}.sti.rp .std{background:#FF3333;border-color:#FF3333;color:#fff}
.stl{display:block}
.bnd{border-radius:var(--rs);padding:9px 11px;font-size:12px;line-height:1.45;margin-bottom:9px;border:1px solid transparent}
.bnd.am{background:var(--am2);color:var(--am);border-color:rgba(255,181,71,.25)}
.bnd.gr{background:var(--gr2);color:var(--gr);border-color:rgba(0,200,150,.25)}
.bnd.bl{background:rgba(59,130,246,.13);color:#7DB4FF;border-color:rgba(59,130,246,.35)}
.bnd.rpt{background:rgba(255,90,60,.12);color:#FF9B85;border-color:rgba(255,90,60,.35)}
.toast.tundo{display:flex;align-items:center;gap:12px;text-align:left}
.toast.tundo button{background:var(--ac);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--b2);color:var(--t);padding:10px 20px;border-radius:var(--r);font-size:13px;z-index:200;white-space:normal;text-align:center;max-width:calc(100vw - 32px);animation:ti .25s ease;box-shadow:0 12px 40px rgba(0,0,0,.6);font-weight:600}
@keyframes ti{from{transform:translateX(-50%) translateY(16px);opacity:0}}
.bar-bg{background:var(--bg3);border-radius:3px;height:5px;margin-top:4px}
.bar{height:5px;border-radius:3px;transition:width .6s}
.ubox{background:var(--bg3);border:1px solid var(--b);border-radius:var(--rs);padding:10px 12px;font-size:11px;font-family:monospace;color:var(--ac);word-break:break-all;margin:5px 0;cursor:pointer}
.slbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#555;margin:14px 0 6px}
.aok{background:var(--gr2);color:#60EEC0;border:1px solid rgba(0,200,150,.2);border-radius:var(--rs);padding:10px 13px;font-size:12px;margin-bottom:8px;font-weight:600}
@media(min-width:500px){.kg{grid-template-columns:repeat(4,1fr)}.modal{border-radius:16px;margin-bottom:24px}.mbg{align-items:center}}
/* Mobile : champs à 16px minimum = pas de zoom automatique iOS ; zones tactiles confortables */
@media (max-width:760px){
  .fr input,.fr select,.fr textarea,input,select,textarea{font-size:16px!important}
  .btn{min-height:40px}.bsm{min-height:32px}
  .cbtn .lt{display:none}.cbtn{padding:0 9px}
  .kv{font-size:22px}.codamt{font-size:26px}
}
@media (max-width:360px){
  .g2{grid-template-columns:1fr}.kg{gap:6px}.kpi{padding:11px}.cb{padding:12px}
}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <img class="hlogo" src="logo-blanc.png" alt="Bencor Shop">
  <button class="cbtn" onclick="openCurModal()">💱<span id="clbl">USD</span></button>
  <div class="sdot l" id="sdot"></div>
  <button class="cbtn" id="bell" style="display:none;margin-left:8px" onclick="activerNotifs(true)" aria-label="Activer les notifications">🔔<span class="lt">Activer</span></button>
  <button class="cbtn" id="lo" style="display:none;margin-left:8px" onclick="logout()" aria-label="Se déconnecter">🔒<span class="lt">Sortir</span></button>
</div>
<div class="rbar" id="rbar">
  <button class="rb ra on" onclick="setRole('admin')">👑 Admin</button>
  <button class="rb rc" onclick="setRole('closeur')">📞 Closeur</button>
  <button class="rb rl" onclick="setRole('livreur')">🚚 Livreur</button>
</div>
<div id="login" style="display:none;position:fixed;inset:0;z-index:999;background:var(--bg);align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 18px 24px;overflow-y:auto">
  <div style="width:100%;max-width:360px;margin:auto 0">
    <div style="text-align:center;margin-bottom:20px">
      <div style="background:#fff;border-radius:18px;padding:18px 22px;display:inline-block;max-width:100%;box-shadow:0 6px 24px rgba(0,0,0,.35)"><img src="logo-couleur.png" alt="Bencor Shop" style="display:block;width:100%;max-width:280px;height:auto"></div>
      <div style="color:#888;font-size:13px;margin-top:12px">Gestion des commandes COD</div>
    </div>
    <div class="lt2" style="display:flex;gap:6px;margin-bottom:14px">
      <button id="ltab1" class="rb ra on" style="padding:11px" onclick="loginTab(1)">Connexion</button>
      <button id="ltab2" class="rb ra" style="padding:11px" onclick="loginTab(2)">Demander l'accès</button>
    </div>
    <form id="lform1" onsubmit="doLogin();return false" autocomplete="on">
      <div class="fr"><label>E-mail</label><input id="lemail" type="email" autocomplete="username" inputmode="email" autocapitalize="none" placeholder="ton@email.com"></div>
      <div class="fr"><label>Mot de passe</label><input id="lpass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button id="lbtn" type="submit" class="btn bp" style="width:100%;padding:13px;font-size:15px">Se connecter</button>
      <div style="color:#888;font-size:12px;line-height:1.6;margin-top:14px;text-align:center">📞 Closeuses et 🚚 livreurs : ouvrez simplement <strong style="color:var(--t)">votre lien personnel</strong> reçu de l'administrateur, aucun mot de passe nécessaire.</div>
    </form>
    <form id="lform2" style="display:none" onsubmit="doSignup();return false" autocomplete="off">
      <div class="fr"><label>Nom complet</label><input id="sname" type="text" autocomplete="name" placeholder="Prénom Nom"></div>
      <div class="fr"><label>E-mail</label><input id="semail" type="email" inputmode="email" autocapitalize="none" placeholder="ton@email.com"></div>
      <div class="fr"><label>Mot de passe (8 caractères min.)</label><input id="spass" type="password" autocomplete="new-password" placeholder="••••••••"></div>
      <div class="fr"><label>Je suis</label><select id="srole"><option value="closeur">📞 Closeuse / Closeur</option><option value="livreur">🚚 Livreur</option><option value="admin">👑 Administrateur</option></select></div>
      <button id="sbtn" type="submit" class="btn bp" style="width:100%;padding:13px;font-size:15px">Envoyer ma demande</button>
      <div style="color:#888;font-size:12px;line-height:1.6;margin-top:14px;text-align:center">Ta demande sera examinée par l'administrateur, qui choisira ton niveau d'accès.</div>
    </form>
    <div id="lmsg" style="font-size:13px;margin-top:14px;min-height:18px;text-align:center;color:var(--re)"></div>
  </div>
</div>
<div class="nav" id="nav"></div>
<div class="ct" id="main"><div class="loader"><div class="spin"></div><div>Chargement des données...</div><div style="font-size:11px;color:#555;margin-top:8px">Connexion au Google Sheet</div></div></div>
<div id="mct"></div>
</div>
<script>
const SHEET_ID="1-UoulnD4iOFmZ9M_Thbm8qzeDdBGCFRjinbyIY0Syyc";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzUdq2b7I2xyBpmhQJrv1JmU771bb10LXwOK-DgEji5lpAPcKNY15nzIxruWC93GOPfCA/exec";
const DEV={USD:{s:'$',n:'Dollar US',r:1},EUR:{s:'€',n:'Euro',r:0.92},XOF:{s:'F',n:'Franc CFA (UEMOA)',r:1},XAF:{s:'F',n:'Franc CFA (CEMAC)',r:1},MAD:{s:'DH',n:'Dirham marocain',r:9.9},GHS:{s:'₵',n:'Cedi ghanéen',r:15.5},NGN:{s:'₦',n:'Naira nigérian',r:1600},GNF:{s:'FG',n:'Franc guinéen',r:8600}};
let CC=localStorage.getItem('CA_CUR')||'USD';
const cur=()=>DEV[CC]||DEV.USD;
function fmt(v){const c=cur(),x=v*c.r;return c.s+(x>=1000?Math.round(x).toLocaleString('fr-FR'):(x<10?x.toFixed(2):Math.round(x)));}
function openCurModal(){openModal(`<h3>💱 Devise</h3><div class="mopts">${Object.entries(DEV).map(([k,c])=>`<button class="mopt ${CC===k?'sel':''}" onclick="setCur('${k}')"><strong>${c.s} ${k}</strong> — ${c.n}${k!=='USD'?`<span style="float:right;font-size:10px;opacity:.5">1$=${c.r}</span>`:''}</button>`).join('')}</div><div class="mbtns"><button class="btn" style="flex:1" onclick="closeModal()">Fermer</button></div>`);}
function setCur(k){CC=k;localStorage.setItem('CA_CUR',k);document.getElementById('clbl').textContent=k;closeModal();render();toast(`Devise : ${cur().s}${k}`);}
let role='admin',tab='dashboard',orders=[],cfg={produits:[],paysUniques:[],villesParPays:{},livreurs:[],closeurs:[]},fFrom='',fTo='';
let UROLE='',UNOM='',UTYPE='';
const isSoc=()=>UROLE==='livreur'&&UTYPE==='societe';
const getCode=()=>{try{return localStorage.getItem('CA_CODE')||''}catch(e){return''}};
const setCode=c=>{try{c?localStorage.setItem('CA_CODE',c):localStorage.removeItem('CA_CODE')}catch(e){}};
async function api(params){
  const q=new URLSearchParams(params);q.set('code',getCode());
  const r=await fetch(SCRIPT_URL+'?'+q.toString());
  const j=await r.json();
  if(j.auth===false){setCode('');showLogin('Session expirée, reconnecte-toi.');throw new Error('auth');}
  return j;
}
let _dp=null,_dt=0;
async function fetchData(){
  if(_dp&&Date.now()-_dt<4000)return _dp;
  _dt=Date.now();
  _dp=api({action:'DATA'}).then(j=>{if(!j.ok)throw new Error(j.msg||'Erreur');return j;});
  _dp.catch(()=>{_dp=null;});
  return _dp;
}
function lmsg(t,ok){const m=document.getElementById('lmsg');m.textContent=t||'';m.style.color=ok?'var(--gr)':'var(--re)';}
function showLogin(msg){
  document.getElementById('login').style.display='flex';
  loginTab(1);lmsg(msg||'');
}
function loginTab(n){
  document.getElementById('lform1').style.display=n===1?'':'none';
  document.getElementById('lform2').style.display=n===2?'':'none';
  document.getElementById('ltab1').classList.toggle('on',n===1);
  document.getElementById('ltab2').classList.toggle('on',n===2);
  lmsg('');
}
async function hashPw(email,pw){
  if(!(window.crypto&&crypto.subtle))throw new Error('Navigateur non compatible (utilise Chrome ou Safari).');
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode('codafrik:'+email.trim().toLowerCase()),iterations:100000},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function post(payload){
  try {
    // Convertit le payload en paramètres URL pour Apps Script
    const params = new URLSearchParams();
    if(payload.action==='ADD_COMMANDE') {
      const d=payload.data||[];
      params.append('action','ADD');
      params.append('id',payload.cmdId||d[0]||'');
      params.append('date',d[1]||'');
      params.append('shopify',d[2]||'');
      params.append('client',d[3]||'');
      params.append('tel',d[4]||'');
      params.append('pays',d[5]||'');
      params.append('ville',d[6]||'');
      params.append('produit',d[7]||'');
      params.append('qte',d[8]||'1');
      params.append('prix',d[10]||'0');
      params.append('frais',d[12]||'3.5');
      params.append('closeur',payload.closeurNom||d[14]||'');
      params.append('statut',payload.statut||d[19]||'En attente');
      params.append('source',d[23]||'');
    } else if(payload.action==='UPDATE_STATUT') {
      params.append('action','UPDATE');
      params.append('id',payload.cmdId||'');
      params.append('statut',payload.statut||'');
      params.append('motif',payload.motif||'');
      if(payload.frais) params.append('frais',payload.frais);
    } else if(payload.action==='ASSIGN_CLOSEUR') {
      params.append('action','UPDATE');
      params.append('id',payload.cmdId||'');
      params.append('closeur',payload.closeurNom||'');
      params.append('statut','Assignée closeur');
    } else if(payload.action==='ASSIGN_LIVREUR') {
      params.append('action','UPDATE');
      params.append('id',payload.cmdId||'');
      params.append('livreur',payload.livreurNom||'');
      params.append('statut','Assignée livreur');
      if(payload.dateLiv)  params.append('dateLiv',payload.dateLiv);
      if(payload.heureLiv) params.append('heureLiv',payload.heureLiv);
      if(payload.noteLiv)  params.append('noteLiv',payload.noteLiv);
      if(payload.quartier) params.append('quartier',payload.quartier);
      if(payload.quartier) params.append('quartierCol',payload.quartier);
    } else if(payload.action==='CONFIRM_LIVRAISON') {
      params.append('action','UPDATE');
      params.append('id',payload.cmdId||'');
      params.append('statut','Livrée ✓');
      params.append('frais',payload.frais||'0');
      params.append('motif',payload.motif||'');
    } else if(payload.action==='SET_COURSIER') {
      params.append('action','UPDATE');
      params.append('id',payload.cmdId||'');
      params.append('coursier',payload.coursier||'');
    } else if(payload.action==='RAW') {
      params.append('action','UPDATE');
      params.append('id',payload.cmdId||'');
      Object.entries(payload.params||{}).forEach(([k,v])=>params.append(k,v));
    } else if(payload.action==='DELETE_COMMANDE') {
      params.append('action','DELETE');
      params.append('id',payload.cmdId||'');
    }
    const j = await api(Object.fromEntries(params));
    if(j.ok!==true){toast('⚠️ Non enregistré : '+(j.msg||'erreur'),5000);return false;}
    return true;
  } catch(e) { console.error('Script error:',e); if(e.message!=='auth')toast('⚠️ Non enregistré : connexion impossible',5000); return false; }
}

// Applique tout de suite à l'écran, envoie en arrière-plan, propose d'annuler ; revient en arrière si l'envoi échoue
async function doAct(id,patch,payload,label,undoParams){
  const o=orders.find(x=>x.id===id);if(!o)return false;
  const prev={};Object.keys(patch).forEach(k=>prev[k]=o[k]);
  localUp(id,patch);
  const pend=post(payload);
  if(label&&undoParams) toastUndo(label,async()=>{
    await pend;localUp(id,prev);
    const r=await post({action:'RAW',cmdId:id,params:undoParams});
    if(r)toast('↩ Action annulée'); else {localUp(id,patch);toast('⚠️ Annulation impossible',4000);}
  }); else if(label) toast(label);
  const ok=await pend;
  if(!ok){localUp(id,prev);if(_undoEl){_undoEl.remove();_undoEl=null;}}
  return ok;
}

function rClP(){const noms=[...new Set(orders.map(o=>o.closeur).filter(Boolean))];if(!noms.length)return '<div class="empty">Aucune donnée closeur</div>';return `<div class="card"><div class="ch">📞 Performance closeurs</div><div class="tw"><table><tr><th>Closeur</th><th>Assignées</th><th>Confirmées</th><th>Annulées</th><th>Taux</th><th>CA</th></tr>${noms.map(cl=>{const a=orders.filter(o=>o.closeur===cl).length;const c=orders.filter(o=>o.closeur===cl&&['Confirmée','Assignée livreur','En livraison','Livrée ✓'].includes(o.statut)).length;const ann=orders.filter(o=>o.closeur===cl&&o.statut==='Annulée').length;const ca=orders.filter(o=>o.closeur===cl&&o.statut==='Livrée ✓').reduce((s,o)=>s+o.prix*o.qte,0);const t=a>0?Math.round(c/a*100):0;const col=t>=75?'var(--gr)':t>=50?'var(--am)':'var(--re)';return `<tr><td><strong>${esc(cl)}</strong></td><td>${a}</td><td>${c}</td><td>${ann}</td><td style="color:${col};font-weight:700">${t}%<div class="bar-bg"><div class="bar" style="width:${t}%;background:${col}"></div></div></td><td><strong>${fmt(ca)}</strong></td></tr>`;}).join('')}</table></div></div>`;}

function rMot(){function ch(list,col){if(!list.length)return '<div class="empty">Aucun motif</div>';const cnt={};list.forEach(o=>{if(o.motif)cnt[o.motif]=(cnt[o.motif]||0)+1;});const mx=Math.max(...Object.values(cnt));return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${esc(m)}</span><strong>${n}</strong></div><div class="bar-bg"><div class="bar" style="width:${Math.round(n/mx*100)}%;background:${col}"></div></div></div>`).join('');}return `<div class="card"><div class="ch">✕ Refus <span style="background:var(--re2);color:#FF8FAA;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">${orders.filter(o=>o.statut==='Refusée').length}</span></div><div class="cb">${ch(orders.filter(o=>o.statut==='Refusée'),'var(--re)')}</div></div><div class="card"><div class="ch">✕ Annulations <span style="background:rgba(100,100,130,.15);color:#888;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">${orders.filter(o=>o.statut==='Annulée').length}</span></div><div class="cb">${ch(orders.filter(o=>o.statut==='Annulée'),'#888')}</div></div>`;}

// ═══════════ RÈGLEMENTS : argent à reverser ═══════════
// À reverser = COD encaissé sur les livraisons réussies − frais gardés par le livreur − versements déjà faits
function calcSolde(nom){
  const liv=orders.filter(o=>o.livreur===nom&&o.statut==='Livrée ✓');
  const enc=liv.reduce((a,o)=>a+o.prix*o.qte,0),frais=liv.reduce((a,o)=>a+o.frais,0);
  const vers=(cfg.reglements||[]).filter(r=>r.livreur===nom).reduce((a,r)=>a+r.montant,0);
  return {n:liv.length,enc,frais,du:enc-frais,vers,reste:enc-frais-vers};
}
function rSolde(){
  const moi=UNOM||cfg.livreurs[0]?.nom||'';const c=calcSolde(moi);
  const hist=(cfg.reglements||[]).filter(r=>r.livreur===moi).slice().reverse().slice(0,10);
  return `<div class="card" style="border-color:${c.reste>0?'rgba(255,181,71,.4)':'rgba(0,200,150,.3)'}"><div class="ch">💰 Mon solde à reverser</div><div class="cb">
  <div class="cod" style="margin:0 0 12px"><div><div class="codlbl">Reste à reverser</div><div class="codamt" style="color:${c.reste>0?'var(--am)':'var(--gr)'}">${fmt(Math.max(c.reste,0))}</div></div></div>
  <div style="font-size:12px;color:#888;line-height:1.9">📦 ${c.n} livraison(s) réussie(s)<br>💵 COD encaissé : <strong style="color:var(--t)">${fmt(c.enc)}</strong><br>➖ Tes frais gardés : <strong style="color:var(--t)">${fmt(c.frais)}</strong><br>✅ Déjà reversé : <strong style="color:var(--t)">${fmt(c.vers)}</strong>${c.reste<0?`<br><span style="color:var(--gr)">Tu as reversé ${fmt(-c.reste)} de plus que dû.</span>`:''}</div>
  ${hist.length?`<div style="margin-top:12px;border-top:1px solid var(--b);padding-top:10px;font-size:12px"><div class="slbl">Derniers versements</div>${hist.map(r=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:#888">${esc(r.date)}${r.note?' · '+esc(r.note):''}</span><strong>${fmt(r.montant)}</strong></div>`).join('')}</div>`:''}</div></div>`;
}
function rReglements(){
  const noms=[...new Set([...orders.filter(o=>o.livreur).map(o=>o.livreur),...(cfg.reglements||[]).map(r=>r.livreur)])];
  const rows=noms.map(nom=>({nom,...calcSolde(nom),soc:(cfg.coursiers||[]).some(c=>c.societe===nom)})).sort((a,b)=>b.reste-a.reste);
  const total=rows.reduce((a,r)=>a+Math.max(r.reste,0),0);
  const hist=(cfg.reglements||[]).slice().reverse().slice(0,20);
  return `<div class="kg"><div class="kpi" style="border-top-color:var(--am)"><div class="kl">Total à récupérer</div><div class="kv" style="color:var(--am)">${fmt(total)}</div><div class="ks">chez ${rows.filter(r=>r.reste>0).length} livreur(s)</div></div><div class="kpi" style="border-top-color:var(--gr)"><div class="kl">Déjà reversé</div><div class="kv">${fmt(rows.reduce((a,r)=>a+r.vers,0))}</div></div></div>
  <div class="card"><div class="ch">💰 Solde par livreur</div><div class="cb" style="padding-top:4px">
  ${rows.map(r=>`<div style="padding:12px 0;border-bottom:1px solid var(--b)"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong>🚚 ${esc(r.nom)}</strong><span style="font-weight:800;font-size:16px;color:${r.reste>0?'var(--am)':'var(--gr)'}">${fmt(Math.max(r.reste,0))}</span></div>
  <div style="font-size:11px;color:#888;margin:5px 0 8px;line-height:1.7">${r.soc?'🏢 Société · ':''}${r.n} livraison(s) · encaissé ${fmt(r.enc)} − frais ${fmt(r.frais)} − reversé ${fmt(r.vers)}</div>
  <button class="btn bsm ${r.reste>0?'bs':''}" onclick="openVersement('${esc(r.nom).replace(/'/g,"\\'")}')">💰 Enregistrer un versement</button></div>`).join('')||'<div class="empty">Aucun livreur avec des livraisons</div>'}
  <p style="font-size:11px;color:#666;line-height:1.6;margin-top:10px">Reste à reverser = COD encaissé sur les livraisons réussies − frais que le livreur garde − versements déjà enregistrés.</p></div></div>
  <div class="card"><div class="ch">🧾 Derniers versements</div><div class="cb" style="padding-top:4px">${hist.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b);font-size:12px"><div><strong>${esc(r.livreur)}</strong><div style="color:#888;font-size:11px">${esc(r.date)}${r.note?' · '+esc(r.note):''}</div></div><div style="display:flex;align-items:center;gap:8px"><strong style="color:var(--gr)">${fmt(r.montant)}</strong><button class="btn bsm bd" onclick="delVersement('${esc(r.id)}')">🗑</button></div></div>`).join('')||'<div class="empty">Aucun versement enregistré</div>'}</div></div>`;
}
function openVersement(nom){
  const c=calcSolde(nom),def=Math.max(0,Math.round(c.reste*cur().r));
  openModal(`<h3>💰 Versement de ${esc(nom)}</h3><div class="msub">Reste à reverser : ${fmt(Math.max(c.reste,0))}</div>
  <div class="fr"><label>Montant reçu (${CC})</label><input id="vMont" type="number" inputmode="decimal" min="0" value="${def||''}"></div>
  <div class="fr"><label>Note (facultatif)</label><input id="vNote" type="text" placeholder="Cash, Mobile Money, virement..." autocomplete="off"></div>
  <div class="mbtns"><button class="btn" style="flex:1" onclick="closeModal()">Annuler</button><button class="btn bs" style="flex:1" onclick="saveVersement('${esc(nom).replace(/'/g,"\\'")}')">✓ Enregistrer</button></div>`);
}
async function saveVersement(nom){
  const v=parseFloat(document.getElementById('vMont').value),note=document.getElementById('vNote').value.trim();
  if(!(v>0)){toast('Entre un montant');return;}
  const j=await api({action:'REGLEMENT_ADD',livreur:nom,montant:String(v/cur().r),note}).catch(()=>null);
  if(!j?.ok){toast('⚠️ '+(j?.msg||'Impossible'),4500);return;}
  closeModal();toast('✓ Versement enregistré');_dp=null;await refreshNow();
}
async function delVersement(id){
  if(!confirm('Supprimer ce versement ?'))return;
  const j=await api({action:'REGLEMENT_DEL',id}).catch(()=>null);
  if(!j?.ok){toast('⚠️ '+(j?.msg||'Impossible'));return;}
  toast('Versement supprimé');_dp=null;await refreshNow();
}

async function setCoursier(id,nom){
  const o=orders.find(x=>x.id===id);const avant=o?.coursier||'';

const PAYS_TEL={'cameroun':'237','cameroon':'237',"côte d'ivoire":'225',"cote d'ivoire":'225','ivory coast':'225','sénégal':'221','senegal':'221','mali':'223','bénin':'229','benin':'229','togo':'228','gabon':'241','burkina faso':'226','burkina':'226','guinée':'224','guinee':'224','congo':'242','rdc':'243','canada':'1','états-unis':'1','usa':'1','france':'33'};
function waNum(tel,pays){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);
  else if(d.length<=10){
    const code=PAYS_TEL[String(pays||'').trim().toLowerCase()]||'';
    if(code){if(code!=='225'&&d.startsWith('0'))d=d.slice(1);d=code+d;}
  }
  return d;
}
function adresseCmd(o){
  const vil=String(o.ville||'').replace(/\s*—\s*.*$/,'').trim();
  const parts=[o.quartier&&o.quartier!==vil?o.quartier:'',vil,o.pays].filter(Boolean);
  return parts.join(', ');
}

  if(o.coursier)L.push(`👤 Coursier : ${o.coursier}`);

function lastMove(o){
  const hs=(HISTO||[]).filter(r=>r[2]===o.id);
  if(hs.length){const r=hs[hs.length-1];const d=new Date(r[0]+'T'+(r[1]||'00:00:00'));if(!isNaN(d))return d;}

const dureeH=hh=>hh<48?Math.max(1,Math.round(hh))+' h':Math.round(hh/24)+' j';
function bloques(list){
  const now=Date.now(),out=[];
  list.forEach(o=>{
    if(ST_FIN.includes(o.statut))return;
    const lm=lastMove(o),age=lm?(now-lm.getTime())/3600000:0;let why='';
    if(ST_CHEZ.includes(o.statut)){
      const dl=o.dateLiv?new Date(o.dateLiv+'T23:59:59'):null;
      if(dl&&!isNaN(dl)&&dl.getTime()<now)why='Date de livraison dépassée ('+fdate(o.dateLiv)+') — '+o.livreur;
      else if(age>48)why='Chez '+o.livreur+' depuis '+dureeH(age);
    }else if(age>24)why=o.statut+' depuis '+dureeH(age);
    if(why)out.push({o,why,age});
  });
  return out.sort((a,b)=>b.age-a.age);
}

      <button class="btn" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn bp" style="flex:1" onclick="confirmerRelance('${esc(id)}')">🔄 Relancer</button>
    </div>`);
}

async function confirmerRelance(id){
  const lv=document.getElementById('rliv')?.value;
  const dliv=document.getElementById('rdliv')?.value||'';
  const hliv=document.getElementById('rhliv')?.value||'';
  const note=document.getElementById('rnoteliv')?.value||'';
  const qtier=document.getElementById('rquartier')?.value||'';
  const o=orders.find(x=>x.id===id);
  if(o){
    o.livreur=lv;
    o.statut='Assignée livreur';
    o.dateLiv=dliv;
    o.heureLiv=hliv;
    o.noteLiv=note;
    o.quartier=qtier;
    o.motif='';
  }
  await post({action:'ASSIGN_LIVREUR',cmdId:id,livreurNom:lv,dateLiv:dliv,heureLiv:hliv,noteLiv:note,quartier:qtier,quartierCol:qtier});
  closeModal();
  render();
  afterPlan(id,'Livraison relancée');
}

async function fermerDefinitivement(id){
  openModal(`<h3>✕ Fermer définitivement ?</h3>
    <p class="msub">La commande sera marquée comme Refusée — action irréversible</p>
    <div class="fr"><label>Motif final</label>
      <textarea id="motifFinal" placeholder="Ex: Client injoignable après plusieurs tentatives..." style="min-height:60px"></textarea>
    </div>
    <div class="mbtns">
      <button class="btn" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn bd" style="flex:1" onclick="confirmerFermeture('${esc(id)}')">✕ Fermer</button>
    </div>`);
}

async function confirmerFermeture(id){
  const motif=document.getElementById('motifFinal')?.value||'Refus définitif après rappel';
  localUp(id,{statut:'Refusée',motif});
  await post({action:'UPDATE_STATUT',cmdId:id,statut:'Refusée',motif});
  closeModal();
  toast('❌ Commande fermée définitivement');
}

async function init(){
  document.getElementById('clbl').textContent=CC;
  const kp=new URLSearchParams(location.search).get('k');
  if(kp){setCode(kp.trim());try{history.replaceState(null,'',location.pathname);}catch(e){}}
  if(!getCode()){showLogin();return;}
  let me;
  try{
    // un seul appel au serveur : identifie ET charge les données (avant : 2 appels l'un après l'autre)
    const r=await fetch(SCRIPT_URL+'?'+new URLSearchParams({action:'DATA',code:getCode()}).toString());
    me=await r.json();
    if(me.ok){_dp=Promise.resolve(me);_dt=Date.now();}
  }catch(e){document.getElementById('main').innerHTML='<div class="empty">Connexion impossible. Vérifie internet puis <a href="" style="color:var(--ac)">réessaie</a>.</div>';return;}
  if(!me.ok){setCode('');showLogin(me.auth===false?(kp?'Ce lien n\'est plus valide. Demande un nouveau lien à l\'administrateur.':''):(me.msg||''));return;}
  document.getElementById('login').style.display='none';
  document.getElementById('lo').style.display='';
  setTimeout(()=>activerNotifs(false),1500);
  clearBadge();
  UROLE=me.role;UNOM=me.role==='admin'?'':me.nom;UTYPE=me.type||'';
  if(UROLE!=='admin'){
    role=UROLE;tab=role==='closeur'?'mes_cmd':'mes_liv';
    document.getElementById('rbar').style.display='none';
  }
  ss('l');
  try{cfg=await loadConfig();console.log(`✅ Config: ${cfg.produits.length}P | ${cfg.closeurs.length}C | ${cfg.livreurs.length}L`);}
  catch(e){console.error('Config:',e.message);}
  try{
    orders=await loadOrders();
    ss('');
    console.log(`✅ ${orders.length} commandes`);
  }catch(e){
    ss('e');
    console.error('Orders:',e.message);
  }
  render();
  // Rafraîchissement toutes les 60s
  setInterval(async()=>{
    try{const[o,c]=await Promise.all([loadOrders(),loadConfig()]);orders=o;cfg=c;ss('');if(!editing())render();}
    catch(e){ss('e');}
  },90000);

  // Vérification notifications toutes les 5 minutes
  checkNotifications();
  setInterval(checkNotifications, 300000);
}

// ═══════════════════════════════════════
//  NOTIFICATIONS LIVRAISONS
// ═══════════════════════════════════════
function checkNotifications(){
  const moi = UNOM || '';
  if(!moi) return; // Seulement pour closeur/livreur connectés

  const today = new Date().toISOString().split('T')[0];
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr = tomorrow.toISOString().split('T')[0];

  // Commandes avec livraison aujourd'hui ou demain
  const upcoming = orders.filter(o => {
    if(!o.dateLiv) return false;
    if(o.statut === 'Livrée ✓') return false;
    const isMyClo = o.closeur === moi;
    const isMyLiv = o.livreur === moi;
    if(!isMyClo && !isMyLiv) return false;
    return o.dateLiv === today || o.dateLiv === tomorrowStr;
  });

  if(upcoming.length === 0) return;

  // Affiche notification dans l'app
  const notifDiv = document.getElementById('notif-bar');
  if(notifDiv) notifDiv.remove();

  const bar = document.createElement('div');
  bar.id = 'notif-bar';
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:linear-gradient(135deg,#FF5A3C,#FF8A70);color:#fff;padding:10px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.4)';
  
  const today_count = upcoming.filter(o=>o.dateLiv===today).length;
  const tomorrow_count = upcoming.filter(o=>o.dateLiv===tomorrowStr).length;
  
  let msg = '🔔 ';
  if(today_count) msg += `${today_count} livraison(s) AUJOURD'HUI`;
  if(today_count && tomorrow_count) msg += ' · ';
  if(tomorrow_count) msg += `${tomorrow_count} livraison(s) DEMAIN`;
  
  bar.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700">✕</button>`;
  document.body.prepend(bar);

  // Auto-hide après 10 secondes
  setTimeout(()=>bar?.remove(), 10000);
}

init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
